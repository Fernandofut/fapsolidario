<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/js/tema.js"></script>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <title>FAP SOLIDÁRIO - Receber Doações</title>
    <link rel="stylesheet" href="/assets/css/stylereceber.css" />
</head>

<body>
    <div class="seletor-idioma">
      <button type="button" class="btn-lang active" data-lang="pt">PT</button>
      <button type="button" class="btn-lang" data-lang="en">EN</button>
      <button type="button" class="btn-lang" data-lang="es">ES</button>
    </div>
    <main class="painel">
        <header class="topo">
            <div>
                <h1 class="titulo-painel">RECEBER DOAÇÕES</h1>
                <p class="boas-vindas" id="boas-vindas">Carregando seu perfil...</p>
            </div>
            <a href="#" id="btn-sair" class="btn-sair">SAIR DA CONTA</a>
        </header>

        <nav class="abas" id="abas">
            <button type="button" class="aba ativa" data-aba="alimentos">🍎 ALIMENTOS</button>
            <button type="button" class="aba" data-aba="roupas">👕 ROUPAS</button>
            <button type="button" class="aba" data-aba="higiene">🧼 HIGIENE</button>
            <button type="button" class="aba" data-aba="moveis">🪑 MÓVEIS</button>
            <button type="button" class="aba" data-aba="cultura">📚 CULTURA E OUTROS</button>
            <button type="button" class="aba" data-aba="dinheiro">💰 DINHEIRO</button>
            <button type="button" class="aba" data-aba="pedidos">📋 MEUS PEDIDOS</button>
        </nav>

        <section id="painel-itens">
            <div class="grade-itens" id="grade-itens"></div>
        </section>

        <section id="painel-pedidos" hidden>
            <div class="table-responsive">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Item</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Data</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-pedidos">
                        <tr class="vazio">
                            <td colspan="6">Você ainda não fez pedidos.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div class="rodape">
            <a href="/pages/informacoes.html">MAIS INFORMAÇÕES</a>
        </div>
    </main>

    <div class="modal-overlay" id="modal-solicitacao">
        <div class="modal-box">
            <h3>Solicitar Doação</h3>
            <p class="sub" id="modal-item-nome"></p>
            <div class="campo">
                <label for="modal-qtd">Quantidade desejada</label>
                <input type="number" id="modal-qtd" min="1" value="1" />
            </div>
            <div class="modal-botoes">
                <button class="btn-cancelar" type="button" id="btn-cancelar-solicitacao">Cancelar</button>
                <button class="btn-confirmar" type="button" id="btn-confirmar-solicitacao">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/receber.js"></script>
    <script src="/assets/js/tradutor.js"></script>
</body>

</html>
