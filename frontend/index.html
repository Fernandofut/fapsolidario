<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="/assets/js/tema.js"></script>
        <link rel="stylesheet" href="/assets/css/global.css" />
        <title>FAP SOLIDÁRIO - Login</title>
        <link rel="stylesheet" href="/assets/css/design-system.css" />
    </head>
    <body class="ds-page ds-page--center">
        <div class="seletor-idioma">
            <button type="button" class="btn-lang active" data-lang="pt">PT</button>
            <button type="button" class="btn-lang" data-lang="en">EN</button>
            <button type="button" class="btn-lang" data-lang="es">ES</button>
        </div>

        <main class="ds-auth">
            <div class="ds-auth-card">
                <img src="/assets/img/fap.jpeg" alt="FAP SOLIDÁRIO Logo" class="ds-auth-logo" />

                <h1 class="ds-brand">
                    <span class="letra-f">F</span><span class="letra-a">A</span><span class="letra-p">P</span>
                    <span class="letra-s">S</span><span class="letra-o">O</span><span class="letra-l">L</span
                    ><span class="letra-i">I</span><span class="letra-d">D</span><span class="letra-a">Á</span
                    ><span class="letra-r">R</span><span class="letra-i">I</span><span class="letra-o">O</span>
                </h1>
                <p class="ds-auth-subtitle">Entre para doar ou receber doações</p>

                <form id="form-login" class="ds-form">
                    <div class="ds-field">
                        <label class="ds-label" for="email">E-mail</label>
                        <input
                            class="ds-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div class="ds-field">
                        <label class="ds-label" for="senha">Senha</label>
                        <input
                            class="ds-input"
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Sua senha"
                            autocomplete="current-password"
                            required
                        />
                    </div>

                    <p id="msg-erro" class="ds-alert ds-alert--error" role="alert" style="display: none"></p>

                    <button type="submit" class="ds-btn ds-btn--primary ds-btn--block">ENTRAR</button>
                </form>

                <p class="ds-credits">
                    <strong>Contas de teste</strong><br />
                    Doador: <strong>teste@fap.com</strong> / <strong>123456</strong><br />
                    Recebedor: <strong>recebedor@fap.com</strong> / <strong>123456</strong><br />
                    Empresa: <strong>empresa@fap.com</strong> / <strong>123456</strong>
                </p>

                <p class="ds-auth-footer">
                    Ainda não tem conta?
                    <a href="/pages/cadastro.html" class="ds-link">Cadastre-se aqui</a>
                </p>
            </div>
        </main>

        <script src="/assets/js/api.js"></script>
        <script src="/assets/js/login.js"></script>
        <script src="/assets/js/tradutor.js"></script>
    </body>
</html>
